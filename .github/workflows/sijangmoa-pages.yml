name: Deploy Sijangmoa public pilot to Pages

on:
  push:
    branches: [main]
    paths:
      - "sijangmoa-pilot/**"
      - ".github/workflows/sijangmoa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sijangmoa-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public pilot
        uses: actions/upload-pages-artifact@v4
        with:
          path: sijangmoa-pilot
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
